<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semantic Network Visualizer — Epistemic Substrate</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>
    .path-node circle { stroke: #fff !important; stroke-width: 4px !important; }
    .path-link { stroke-width: 4px !important; opacity: 1 !important; }
    #path-status {
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
      min-height: 36px;
      line-height: 1.5;
    }
    .domain-chip {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      border: 1px solid var(--border);
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="app-layout">
  <header class="app-header">
    <a class="back-link" href="../index.html">← Hub</a>
    <h1 style="color: var(--sn-color)">Semantic Network Visualizer</h1>
    <span style="color:var(--text-muted); font-size:12px; margin-left:auto">Typed-Edge Concept Network</span>
  </header>

  <div class="main-content">
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3>Edge Type Filter</h3>
        <div class="checkbox-list" id="rel-filters"></div>
      </div>

      <div class="sidebar-section">
        <h3>Domain Filter</h3>
        <div class="checkbox-list" id="domain-filters"></div>
      </div>

      <div class="sidebar-section">
        <h3>Path Finder</h3>
        <p style="font-size:11px;color:var(--text-muted);margin-bottom:8px">Click two nodes to find the shortest connecting path.</p>
        <div id="path-status">Select a start node…</div>
        <button class="secondary" style="margin-top:8px;width:100%" onclick="clearPath()">Clear Path</button>
      </div>

      <div class="sidebar-section">
        <h3>Relation Types</h3>
        <div class="legend" id="rel-legend"></div>
      </div>

      <div class="sidebar-section">
        <h3>Domains</h3>
        <div class="legend" id="domain-legend"></div>
      </div>
    </aside>

    <div class="canvas-area" id="canvas">
      <svg id="svg"></svg>
    </div>

    <aside class="info-panel" id="info-panel">
      <div id="info-content">
        <p style="color:var(--text-muted);font-size:13px;margin-top:8px">
          Hover nodes for definitions.<br>Click two nodes to find their shortest path.
        </p>
      </div>
    </aside>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const REL_COLORS = {
  'is-a':    '#58a6ff',
  'part-of': '#56d364',
  'causes':  '#f78166',
  'enables': '#39d0d8',
  'opposes': '#f0a500',
  'requires':'#d2a8ff',
  'default': '#8b949e'
};

const DOMAIN_COLORS = {
  'philosophy': '#d2a8ff',
  'biology':    '#56d364',
  'linguistics':'#58a6ff',
  'psychology': '#39d0d8',
  'theory':     '#f0a500',
  'default':    '#8b949e'
};

function relColor(t)    { return REL_COLORS[t]    || REL_COLORS.default; }
function domainColor(d) { return DOMAIN_COLORS[d] || DOMAIN_COLORS.default; }

let graph = { nodes: [], edges: [] };
let simulation, svg, g, linkGroup, nodeGroup;
let activeRels    = new Set();
let activeDomains = new Set();
let pathSelection = [];

const tooltip = (() => {
  const el = document.createElement('div');
  el.className = 'tooltip';
  el.style.opacity = '0';
  document.body.appendChild(el);
  return el;
})();

async function init() {
  const res = await fetch('../data/semantic-network.json');
  graph = await res.json();
  graph.edges.forEach(e => {
    e.source = typeof e.source === 'object' ? e.source.id : e.source;
    e.target = typeof e.target === 'object' ? e.target.id : e.target;
  });
  buildFilters();
  buildLegends();
  buildGraph();
}

function buildFilters() {
  const rels = [...new Set(graph.edges.map(e => e.type))].sort();
  rels.forEach(r => activeRels.add(r));
  const rf = document.getElementById('rel-filters');
  rels.forEach(r => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.addEventListener('change', () => {
      cb.checked ? activeRels.add(r) : activeRels.delete(r);
      applyFilters();
    });
    const line = document.createElement('span');
    line.style.cssText = `display:inline-block;width:16px;height:3px;border-radius:2px;background:${relColor(r)};`;
    label.append(cb, line, document.createTextNode(' ' + r));
    rf.appendChild(label);
  });

  const domains = [...new Set(graph.nodes.map(n => n.domain))].sort();
  domains.forEach(d => activeDomains.add(d));
  const df = document.getElementById('domain-filters');
  domains.forEach(d => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.addEventListener('change', () => {
      cb.checked ? activeDomains.add(d) : activeDomains.delete(d);
      applyFilters();
    });
    const dot = document.createElement('span');
    dot.style.cssText = `display:inline-block;width:10px;height:10px;border-radius:50%;background:${domainColor(d)};`;
    label.append(cb, dot, document.createTextNode(' ' + d));
    df.appendChild(label);
  });
}

function buildLegends() {
  const relLeg = document.getElementById('rel-legend');
  Object.entries(REL_COLORS).filter(([k]) => k !== 'default').forEach(([rel, color]) => {
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<span class="legend-line" style="background:${color}"></span>${rel}`;
    relLeg.appendChild(div);
  });

  const domLeg = document.getElementById('domain-legend');
  Object.entries(DOMAIN_COLORS).filter(([k]) => k !== 'default').forEach(([dom, color]) => {
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<span class="legend-swatch" style="background:${color}"></span>${dom}`;
    domLeg.appendChild(div);
  });
}

function buildGraph() {
  const container = document.getElementById('canvas');
  const W = container.clientWidth || 800;
  const H = container.clientHeight || 600;

  svg = d3.select('#svg').attr('viewBox', [0, 0, W, H]).style('background', 'var(--bg)');

  // Define arrowheads per type
  const defs = svg.append('defs');
  Object.entries(REL_COLORS).forEach(([type, color]) => {
    defs.append('marker')
      .attr('id', `arr-${type}`)
      .attr('viewBox', '0 -5 10 10')
      .attr('refX', 24).attr('refY', 0)
      .attr('markerWidth', 6).attr('markerHeight', 6)
      .attr('orient', 'auto')
      .append('path').attr('d', 'M0,-5L10,0L0,5').attr('fill', color).attr('opacity', 0.7);
  });

  g = svg.append('g');
  svg.call(d3.zoom().scaleExtent([0.1, 8]).on('zoom', e => g.attr('transform', e.transform)));

  simulation = d3.forceSimulation(graph.nodes)
    .force('link', d3.forceLink(graph.edges).id(d => d.id).distance(130))
    .force('charge', d3.forceManyBody().strength(-350))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide(32));

  linkGroup = g.append('g').attr('class', 'links');
  nodeGroup = g.append('g').attr('class', 'nodes');

  renderLinks();
  renderNodes();
  simulation.on('tick', ticked);
}

function renderLinks() {
  const links = linkGroup.selectAll('path').data(graph.edges, d => `${d.source}-${d.target}-${d.type}`);
  links.exit().remove();
  links.enter().append('path')
    .attr('class', 'link')
    .attr('fill', 'none')
    .attr('stroke', d => relColor(d.type))
    .attr('stroke-width', 2)
    .attr('opacity', 0.55)
    .attr('marker-end', d => `url(#arr-${d.type})`);
}

function renderNodes() {
  const nodes = nodeGroup.selectAll('g').data(graph.nodes, d => d.id);
  nodes.exit().remove();
  const enter = nodes.enter().append('g')
    .attr('class', 'node')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',  (e, d) => { d.fx=e.x; d.fy=e.y; })
      .on('end',   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }))
    .on('click', (e, d) => { e.stopPropagation(); handlePathClick(d); showInfoPanel(d); })
    .on('mouseover', (e, d) => { showTooltip(e, d); })
    .on('mousemove', e => { tooltip.style.left=(e.clientX+16)+'px'; tooltip.style.top=(e.clientY-10)+'px'; })
    .on('mouseout', () => { tooltip.style.opacity='0'; });

  enter.append('circle')
    .attr('r', 20)
    .attr('fill', d => domainColor(d.domain))
    .attr('stroke', '#0d1117')
    .attr('stroke-width', 2)
    .attr('fill-opacity', 0.8);

  enter.append('text')
    .attr('text-anchor', 'middle')
    .attr('dominant-baseline', 'middle')
    .attr('font-size', '9px')
    .attr('fill', '#fff')
    .attr('pointer-events', 'none')
    .text(d => d.label.length > 8 ? d.label.slice(0, 7) + '…' : d.label);
}

function ticked() {
  linkGroup.selectAll('path').attr('d', d => {
    const sx = d.source.x || 0, sy = d.source.y || 0;
    const tx = d.target.x || 0, ty = d.target.y || 0;
    const dx = tx - sx, dy = ty - sy;
    const dr = Math.sqrt(dx*dx + dy*dy) * 1.5;
    return `M${sx},${sy}A${dr},${dr} 0 0,1 ${tx},${ty}`;
  });
  nodeGroup.selectAll('g').attr('transform', d => `translate(${d.x||0},${d.y||0})`);
}

function applyFilters() {
  nodeGroup.selectAll('g').style('display', d => activeDomains.has(d.domain) ? null : 'none');
  linkGroup.selectAll('path').style('display', d => {
    if (!activeRels.has(d.type)) return 'none';
    const sId = typeof d.source === 'object' ? d.source.id : d.source;
    const tId = typeof d.target === 'object' ? d.target.id : d.target;
    const sn = graph.nodes.find(n => n.id === sId);
    const tn = graph.nodes.find(n => n.id === tId);
    if (!sn || !tn) return 'none';
    if (!activeDomains.has(sn.domain) || !activeDomains.has(tn.domain)) return 'none';
    return null;
  });
}

// Path finding
function handlePathClick(d) {
  if (pathSelection.length === 0) {
    pathSelection = [d];
    document.getElementById('path-status').innerHTML = `<span style="color:var(--sn-color)">Start:</span> ${d.label}<br>Now select end node…`;
    nodeGroup.selectAll('g').select('circle').attr('stroke', n => n.id === d.id ? '#fff' : '#0d1117').attr('stroke-width', n => n.id === d.id ? 4 : 2);
  } else if (pathSelection.length === 1) {
    pathSelection.push(d);
    findAndShowPath(pathSelection[0].id, pathSelection[1].id);
  } else {
    clearPath();
    pathSelection = [d];
    document.getElementById('path-status').innerHTML = `<span style="color:var(--sn-color)">Start:</span> ${d.label}<br>Now select end node…`;
    nodeGroup.selectAll('g').select('circle').attr('stroke', n => n.id === d.id ? '#fff' : '#0d1117').attr('stroke-width', n => n.id === d.id ? 4 : 2);
  }
}

function findAndShowPath(startId, endId) {
  // BFS on undirected graph
  const adj = {};
  graph.edges.forEach(e => {
    const s = typeof e.source === 'object' ? e.source.id : e.source;
    const t = typeof e.target === 'object' ? e.target.id : e.target;
    if (!adj[s]) adj[s] = [];
    if (!adj[t]) adj[t] = [];
    adj[s].push(t); adj[t].push(s);
  });
  const visited = new Set([startId]);
  const queue = [[startId]];
  let found = null;
  while (queue.length) {
    const path = queue.shift();
    if (path[path.length - 1] === endId) { found = path; break; }
    for (const nb of (adj[path[path.length - 1]] || [])) {
      if (!visited.has(nb)) { visited.add(nb); queue.push([...path, nb]); }
    }
  }

  if (!found) {
    document.getElementById('path-status').innerHTML = `<span style="color:var(--accent3)">No path found</span> between ${startId} and ${endId}.`;
    return;
  }

  const pathSet = new Set(found);
  nodeGroup.selectAll('g').select('circle')
    .attr('stroke', n => pathSet.has(n.id) ? '#fff' : '#0d1117')
    .attr('stroke-width', n => pathSet.has(n.id) ? 4 : 2);

  linkGroup.selectAll('path')
    .attr('stroke-width', e => {
      const s = typeof e.source === 'object' ? e.source.id : e.source;
      const t = typeof e.target === 'object' ? e.target.id : e.target;
      for (let i = 0; i < found.length - 1; i++) {
        if ((found[i] === s && found[i+1] === t) || (found[i] === t && found[i+1] === s)) return 4;
      }
      return 2;
    })
    .attr('opacity', e => {
      const s = typeof e.source === 'object' ? e.source.id : e.source;
      const t = typeof e.target === 'object' ? e.target.id : e.target;
      for (let i = 0; i < found.length - 1; i++) {
        if ((found[i] === s && found[i+1] === t) || (found[i] === t && found[i+1] === s)) return 1;
      }
      return 0.1;
    });

  const pathLabels = found.map(id => {
    const n = graph.nodes.find(n => n.id === id);
    return n ? n.label : id;
  }).join(' → ');
  document.getElementById('path-status').innerHTML =
    `<span style="color:var(--sn-color)">Path (${found.length} nodes):</span><br>${pathLabels}`;
}

function clearPath() {
  pathSelection = [];
  document.getElementById('path-status').textContent = 'Select a start node…';
  nodeGroup.selectAll('g').select('circle').attr('stroke', '#0d1117').attr('stroke-width', 2);
  linkGroup.selectAll('path').attr('stroke-width', 2).attr('opacity', 0.55);
}

function showTooltip(event, d) {
  tooltip.innerHTML = `<h4>${d.label}</h4><p>${(d.definition || '').slice(0, 120)}${d.definition && d.definition.length > 120 ? '…' : ''}</p><span class="domain-chip" style="color:${domainColor(d.domain)};border-color:${domainColor(d.domain)}">${d.domain}</span>`;
  tooltip.style.opacity = '1';
  tooltip.style.left = (event.clientX + 16) + 'px';
  tooltip.style.top  = (event.clientY - 10) + 'px';
}

function showInfoPanel(d) {
  const outEdges = graph.edges.filter(e => {
    const sId = typeof e.source === 'object' ? e.source.id : e.source;
    return sId === d.id;
  });
  const inEdges = graph.edges.filter(e => {
    const tId = typeof e.target === 'object' ? e.target.id : e.target;
    return tId === d.id;
  });

  const outItems = outEdges.map(e => {
    const tId = typeof e.target === 'object' ? e.target.id : e.target;
    const tn = graph.nodes.find(n => n.id === tId);
    return `<li style="border-left-color:${relColor(e.type)}"><span class="rel">${e.type}</span> → ${tn ? tn.label : tId}</li>`;
  }).join('');
  const inItems = inEdges.map(e => {
    const sId = typeof e.source === 'object' ? e.source.id : e.source;
    const sn = graph.nodes.find(n => n.id === sId);
    return `<li style="border-left-color:${relColor(e.type)}">${sn ? sn.label : sId} <span class="rel">${e.type}</span> →</li>`;
  }).join('');

  document.getElementById('info-content').innerHTML = `
    <h2>${d.label}</h2>
    <span class="type-badge" style="color:${domainColor(d.domain)};border-color:${domainColor(d.domain)}">${d.domain}</span>
    <p class="definition">${d.definition || ''}</p>
    ${outItems ? `<h3>Connects To</h3><ul class="edge-list">${outItems}</ul>` : ''}
    ${inItems  ? `<h3>Connected From</h3><ul class="edge-list">${inItems}</ul>`  : ''}
  `;
}

window.addEventListener('resize', () => {
  const W = document.getElementById('canvas').clientWidth;
  const H = document.getElementById('canvas').clientHeight;
  svg.attr('viewBox', [0, 0, W, H]);
  simulation.force('center', d3.forceCenter(W/2, H/2)).alpha(0.3).restart();
});

init();
</script>
</body>
</html>
